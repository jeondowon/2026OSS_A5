<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <button id="btn1" class="btn1">Click Me 1</button>
    </div>
    <br />
    <form id="form1" action="login_ok.html" method="post">
      <input type="text" id="username" name="username" placeholder="이름을 입력하세요" />
      <input type="submit" value="로그인" />
    </form>
  </body>
  <script>
    function clickMe1() {
      alert("Hello");
    }

    function checkForm(e) {
      const username = document.querySelector("#username");
      if (username.value == "") {
        alert("이름을 입력하세요.");
        username.focus();
        e.preventDefault();
        return;
      }
      alert("Validation");
    }

    window.addEventListener("load", function () {
      document.querySelector("#btn1").addEventListener("click", clickMe1);
      document.querySelector("#form1").addEventListener("submit", checkForm);
    });
  </script>
  <style></style>
</html>
