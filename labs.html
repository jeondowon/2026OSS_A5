<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <body>
    <!-- 클릭 버튼 -->
    <button id="clickBtn" onclick="clickMe()">Click Me</button>
    <!-- 덧셈 계산기 -->
    <p style="font-weight: bold">덧셈 계산기</p>
    <input id="num1" style="width: 50px" />
    <input id="num2" style="width: 50px" />
    <button id="addBtn" onClick="add()" style="width: 25px">+</button>
    <input id="result" readonly style="width: 50px" />

    <script>
      //클릭버튼
      function clickMe() {
        //const btn = document.querySelector("#clickBtn");
        const btn = document.getElementById("clickBtn");
        btn.innerText = "clicked";

        //alert("버튼이 클릭되었습니다.");
      }
      //덧셈 계산기
      function add() {
        const num1 = document.querySelector("#num1").value;
        const num2 = document.querySelector("#num2").value;
        const result = Number(num1) + Number(num2);

        document.querySelector("#result").value = result;
      }
    </script>
  </body>
</html>
