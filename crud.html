    <title>동아리 회원 관리</title>

  <body>
    <h1>동아리 회원 관리 CRUD</h1>
    <h2>회원 입력</h2>
    <form id="memberForm">
      <div>
        <label for="name">이름:</label>
        <input type="text" id="name" placeholder="이름" />
      </div>
      <div>
        <label for="studentId">학번:</label>
        <input type="number" id="studentId" placeholder="학번" />
      </div>
      <div>
        <label for="gender">성별:</label>
        <select id="gender">
          <option value="성별" disabled selected>성별</option>
          <option value="남자">남자</option>
          <option value="여자">여자</option>
        </select>
      </div>
      <div>
        <label for="major">전공:</label>
        <select id="major">
          <option value="전공" disabled selected>전공</option>
          <option value="컴퓨터공학심화">컴퓨터공학심화</option>
          <option value="소프트웨어공학">소프트웨어공학</option>
        </select>
      </div>
      <div>
        <label for="email">이메일:</label>
        <input type="email" id="email" placeholder="이메일" />
      </div>
      <button id="addBtn" type="button">Add</button>
    </form>
