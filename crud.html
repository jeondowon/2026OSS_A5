<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>동아리 회원 관리</title>
    <style>
      body {
        background-color: azure;
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      h1 {
        color: black;
        text-align: center;
      }
      .container {
        min-width: 800px;
        height: 80vh;
        margin: auto;
        background-color: rgb(250, 250, 250);
        border: 1px solid;
        border-radius: 5%;
        padding: 20px;
      }
      input {
        padding: 5px;
        margin-bottom: 10px;
        border-radius: 5px;
        outline: none;
      }
      select {
        padding: 5px;
        margin-bottom: 10px;
        border-radius: 5px;
      }
      input:hover,
      input:focus,
      select:focus {
        padding: 5px;
        margin-bottom: 10px;
        border-radius: 5px;
        outline: none;
        border-color: aqua;
      }
      #listTitle {
        text-align: center;
      }
      #table {
        margin: 0 auto;
        width: 100%;
      }
      .addBtn {
        background-color: aquamarine;
        border-radius: 5px;
        min-width: 80px;
      }
      .manageBtns {
        display: flex;
        gap: 1px;
      }
      .manageBtns button {
        flex: 1;
        padding: 6px 0;
      }
      .editBtn {
        background-color: #4a90e2;
        border-radius: 5px;
      }
      .editBtn:hover {
        background-color: #99bee3;
      }

      .deleteBtn {
        background-color: #e25555;
        border-radius: 5px;
      }
      .deleteBtn:hover {
        background-color: #df8f8f;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>동아리 회원 관리 CRUD</h1>
      <h2>회원 입력</h2>
      <form id="memberForm">
        <div>
          <label for="name">이름:</label>
          <input type="text" id="name" placeholder="이름" />
        </div>
        <div>
          <label for="studentId">학번:</label>
          <input type="number" id="studentId" placeholder="학번" />
        </div>
        <div>
          <label for="gender">성별:</label>
          <select id="gender">
            <option value="성별" disabled selected>성별</option>
            <option value="남자">남자</option>
            <option value="여자">여자</option>
          </select>
        </div>
        <div>
          <label for="major">학부:</label>
          <select id="major">
            <option value="학부" disabled selected>학부</option>
            <option value="AI컴퓨터전자">AI컴퓨터전자</option>
            <option value="국제어문학부">국제어문학부</option>
            <option value="경영경제학부">경영경제학부</option>
            <option value="법학부">법학부</option>
            <option value="커뮤니케이션학부">커뮤니케이션학부</option>
            <option value="상담심리사회복지학부">상담심리사회복지학부</option>
            <option value="공간환경시스템공학부">공간환경시스템공학부</option>
            <option value="기계제어공학부">기계제어공학부</option>
            <option value="콘텐츠융합디자인학부">콘텐츠융합디자인학부</option>
            <option value="생명과학부">생명과학부</option>
            <option value="AI융합학부">AI융합학부</option>
            <option value="GLS학부">GLS학부</option>
          </select>
        </div>
        <div>
          <label for="email">이메일:</label>
          <input type="email" id="email" placeholder="이메일" />
        </div>
        <button id="addBtn" type="button" class="addBtn">저장</button>
      </form>

      <h2 id="listTitle">회원 목록</h2>
      <table border="1" id="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>이름</th>
            <th>학번</th>
            <th>성별</th>
            <th>학부</th>
            <th>이메일</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="memberList"></tbody>
      </table>
    </div>

    <script>
      let members = [
        {
          id: 1,
          name: "전도원",
          studentId: 22300650,
          gender: "남자",
          major: "AI컴퓨터전자",
          email: "jeondowon.dev@gmail.com",
        },
        {
          id: 2,
          name: "송주아",
          studentId: 22300404,
          gender: "여자",
          major: "AI컴퓨터전자",
          email: "jooah@gmail.com",
        },
        {
          id: 3,
          name: "서정민",
          studentId: 22300123,
          gender: "남자",
          major: "AI컴퓨터전자",
          email: "jungmin@gmail.com",
        },
      ];

      const tableBody = document.getElementById("memberList");

      function render() {
        tableBody.innerHTML = "";
        members.forEach(function (m) {
          const tr = document.createElement("tr");

          const tdId = document.createElement("td");
          tdId.innerText = m.id;
          tr.appendChild(tdId);

          const tdName = document.createElement("td");
          tdName.innerText = m.name;
          tr.appendChild(tdName);

          const tdStudentId = document.createElement("td");
          tdStudentId.innerText = m.studentId;
          tr.appendChild(tdStudentId);

          const tdGender = document.createElement("td");
          tdGender.innerText = m.gender;
          tr.appendChild(tdGender);

          const tdMajor = document.createElement("td");
          tdMajor.innerText = m.major;
          tr.appendChild(tdMajor);

          const tdEmail = document.createElement("td");
          tdEmail.innerText = m.email;
          tr.appendChild(tdEmail);

          tableBody.appendChild(tr);

          const tdManage = document.createElement("td");

          const editBtn = document.createElement("button");
          editBtn.innerText = "수정";
          editBtn.className = "editBtn";
          editBtn.addEventListener("click", function () {
            name.value = m.name;
            studentId.value = m.studentId;
            gender.value = m.gender;
            major.value = m.major;
            email.value = m.email;
            editingId = m.id;
            //console.log(editingId);
          });

          const deleteBtn = document.createElement("button");
          deleteBtn.innerText = "삭제";
          deleteBtn.className = "deleteBtn";
          deleteBtn.addEventListener("click", function () {
            if (confirm("삭제하시겠어요?")) {
              members = members.filter(function (member) {
                if (member.id !== m.id) {
                  return true;
                } else {
                  return false;
                }
              });
              if (editingId === m.id) {
                editingId = null;
                document.getElementById("memberForm").reset();
              }
              render();
            }
          });

          const btnBox = document.createElement("div");
          btnBox.className = "manageBtns";
          btnBox.appendChild(editBtn);
          btnBox.appendChild(deleteBtn);
          tdManage.appendChild(btnBox);

          tr.appendChild(tdManage);
        });
      }
      render();

      let nextId = 4;
      let editingId = null;

      const name = document.getElementById("name");
      const studentId = document.getElementById("studentId");
      const gender = document.getElementById("gender");
      const major = document.getElementById("major");
      const email = document.getElementById("email");

      function validate() {
        if (name.value.trim() === "") {
          alert("이름을 입력하세요.");
          name.focus();
          return false;
        }
        if (!/^\d{8}$/.test(studentId.value)) {
          alert("학번이 8자리 숫자인지 확인하세요");
          studentId.focus();
          return false;
        }
        if (gender.value === "성별") {
          alert("성별을 선택하세요");
          gender.focus();
          return false;
        }
        if (major.value === "학부") {
          alert("학부를 선택하세요");
          major.focus();
          return false;
        }
        if (email.value.trim() === "" || !email.checkValidity()) {
          alert("이메일 형식을 확인해주세요.");
          email.focus();
          return false;
        }
        return true;
      }

      const addBtn = document.getElementById("addBtn");
      addBtn.addEventListener("click", function () {
        if (!validate()) {
          return;
        }
        if (editingId === null) {
          const newMember = {
            id: nextId,
            name: name.value,
            studentId: Number(studentId.value),
            gender: gender.value,
            major: major.value,
            email: email.value,
          };
          members.push(newMember);
          nextId++;
        } else {
          const target = members.find(function (member) {
            return member.id === editingId;
          });
          target.name = name.value;
          target.studentId = Number(studentId.value);
          target.gender = gender.value;
          target.major = major.value;
          target.email = email.value;

          editingId = null;
        }

        render();
        document.getElementById("memberForm").reset();
      });
    </script>
  </body>
</html>
