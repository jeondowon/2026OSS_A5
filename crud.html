<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>동아리 회원 관리</title>
  </head>
  <body>
    <h1>동아리 회원 관리 CRUD</h1>
    <h2>회원 입력</h2>
    <form id="memberForm">
      <div>
        <label for="name">이름:</label>
        <input type="text" id="name" placeholder="이름" />
      </div>
      <div>
        <label for="studentId">학번:</label>
        <input type="number" id="studentId" placeholder="학번" />
      </div>
      <div>
        <label for="gender">성별:</label>
        <select id="gender">
          <option value="성별" disabled selected>성별</option>
          <option value="남자">남자</option>
          <option value="여자">여자</option>
        </select>
      </div>
      <div>
        <label for="major">전공:</label>
        <select id="major">
          <option value="전공" disabled selected>전공</option>
          <option value="컴퓨터공학심화">컴퓨터공학심화</option>
          <option value="소프트웨어공학">소프트웨어공학</option>
        </select>
      </div>
      <div>
        <label for="email">이메일:</label>
        <input type="email" id="email" placeholder="이메일" />
      </div>
      <button id="addBtn" type="button">Add</button>
    </form>

    <h2>회원 목록</h2>
    <table border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>이름</th>
          <th>학번</th>
          <th>성별</th>
          <th>전공</th>
          <th>이메일</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="memberList"></tbody>
    </table>

    <script>
      let members = [
        {
          id: 1,
          name: "전도원",
          studentId: 22300650,
          gender: "남자",
          major: "컴퓨터공학심화",
          email: "jeondowon.dev@gmail.com",
        },
        {
          id: 2,
          name: "송주아",
          studentId: 22300404,
          gender: "여자",
          major: "컴퓨터공학심화",
          email: "jooah@gmail.com",
        },
        {
          id: 3,
          name: "서정민",
          studentId: 22300123,
          gender: "남자",
          major: "컴퓨터공학심화",
          email: "jungmin@gmail.com",
        },
      ];

      const tableBody = document.getElementById("memberList");

      function render() {
        tableBody.innerHTML = "";
        members.forEach(function (m) {
          const tr = document.createElement("tr");

          const tdId = document.createElement("td");
          tdId.innerText = m.id;
          tr.appendChild(tdId);

          const tdName = document.createElement("td");
          tdName.innerText = m.name;
          tr.appendChild(tdName);

          const tdStudentId = document.createElement("td");
          tdStudentId.innerText = m.studentId;
          tr.appendChild(tdStudentId);

          const tdGender = document.createElement("td");
          tdGender.innerText = m.gender;
          tr.appendChild(tdGender);

          const tdMajor = document.createElement("td");
          tdMajor.innerText = m.major;
          tr.appendChild(tdMajor);

          const tdEmail = document.createElement("td");
          tdEmail.innerText = m.email;
          tr.appendChild(tdEmail);

          tableBody.appendChild(tr);

          const tdManage = document.createElement("td");

          const editBtn = document.createElement("button");
          editBtn.innerText = "수정";
          tdManage.appendChild(editBtn);

          const deleteBtn = document.createElement("button");
          deleteBtn.innerText = "삭제";
          tdManage.appendChild(deleteBtn);

          tr.appendChild(tdManage);
        });
      }
      render();

      let nextId = 4;

      const name = document.getElementById("name");
      const studentId = document.getElementById("studentId");
      const gender = document.getElementById("gender");
      const major = document.getElementById("major");
      const email = document.getElementById("email");

      function validate() {
        if (name.value.trim() === "") {
          alert("이름을 입력하세요.");
          name.focus();
          return false;
        }
        if (studentId.value.length !== 8) {
          alert("학번이 8자리 숫자인지 확인하세요");
          studentId.focus();
          return false;
        }
        if (gender.value === "성별") {
          alert("성별을 선택하세요");
          gender.focus();
          return false;
        }
        if (major.value === "전공") {
          alert("전공을 선택하세요");
          major.focus();
          return false;
        }
        if (email.value.trim() === "" || !email.checkValidity()) {
          alert("이메일 형식을 확인해주세요.");
          email.focus();
          return false;
        }
        return true;
      }

      const addBtn = document.getElementById("addBtn");
      addBtn.addEventListener("click", function () {
        if (!validate()) {
          return;
        }
        const newMember = {
          id: nextId,
          name: name.value,
          studentId: Number(studentId.value),
          gender: gender.value,
          major: major.value,
          email: email.value,
        };

        members.push(newMember);
        nextId++;
        render();
        document.getElementById("memberForm").reset();
      });
    </script>
  </body>
</html>
